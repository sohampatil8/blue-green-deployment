<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annual Picnic Planner</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f4f7f6;
        margin: 0;
        color: #333;
      }
      header {
        background: #2c3e50;
        color: white;
        padding: 20px;
        text-align: center;
      }
      .container {
        max-width: 900px;
        margin: 20px auto;
        padding: 0 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }
      .card {
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s;
        cursor: pointer;
      }
      .card:hover {
        transform: translateY(-5px);
      }
      .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
      }
      .card h3 {
        margin: 15px;
        color: #27ae60;
      }
      .form-section {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      input,
      select,
      button {
        width: 100%;
        padding: 12px;
        margin: 8px 0 20px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        background: #27ae60;
        color: white;
        border: none;
        font-weight: bold;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background: #219653;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🏕️ Weekend Picnic Planner</h1>
      <p>Select a destination and confirm your spot!</p>
    </header>

    <div class="container">
      <div class="grid">
        <!-- Destination 1 -->
        <div class="card" onclick="selectPlace('Sanjay Gandhi National Park')">
          <img
            src="https://images.unsplash.com/photo-1571686708681-9b9359eeb6f1?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=400"
            alt="Sanjay Gandhi National Park"
          />
          <h3>Sanjay Gandhi National Park</h3>
        </div>
        <!-- Destination 2 -->
        <div class="card" onclick="selectPlace('Lonavala Hills')">
          <img
            src="https://images.unsplash.com/photo-1623863484649-43c3fdf97321?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=400"
            alt="Lonavala"
          />
          <h3>Lonavala Hills</h3>
        </div>
        <!-- Destination 3 -->
        <div class="card" onclick="selectPlace('Alibaug Beach')">
          <img
            src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=400"
            alt="Alibaug"
          />
          <h3>Alibaug Beach</h3>
        </div>
      </div>

      <div class="form-section">
        <h2 style="margin-top: 0">Reserve Your Spot</h2>
        <form id="picnicForm" onsubmit="submitForm(event)">
          <label>Full Name</label>
          <input type="text" id="name" required placeholder="John Doe" />

          <label>Preferred Destination (Click a card above to auto-fill)</label>
          <input
            type="text"
            id="destination"
            required
            readonly
            placeholder="Select a location..."
          />

          <label>Dietary Preferences</label>
          <select id="diet">
            <option value="none">No Restrictions</option>
            <option value="veg">Vegetarian</option>
            <option value="vegan">Vegan</option>
          </select>

          <button type="submit">Confirm Registration</button>
        </form>
      </div>
    </div>

    <script>
      function selectPlace(place) {
        document.getElementById("destination").value = place;
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth",
        });
      }

      function submitForm(e) {
        e.preventDefault();
        const name = document.getElementById("name").value;
        const dest = document.getElementById("destination").value;
        alert(`Awesome, ${name}! Your spot for ${dest} is confirmed.`);
        e.target.reset();
      }
    </script>
  </body>
</html>
