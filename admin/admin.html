<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Manager</title>
    <style>
      :root {
        --accent: #f39c12;
        --accent-dark: #d68910;
        --bg: #f0f0f0;
        --card: #fff;
        --border: #ddd;
        --text: #333;
        --muted: #777;
        --danger: #e74c3c;
        --danger-dark: #c0392b;
        --success: #27ae60;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* ── HEADER ── */
      .admin-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: #3d3d3f;
        color: white;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      }

      .admin-header h1 {
        font-size: 18px;
        letter-spacing: 1px;
      }

      .admin-header h1 span {
        color: var(--accent);
      }

      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .btn-preview {
        color: white;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 7px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        text-decoration: none;
        transition: border-color 0.2s;
      }

      .btn-preview:hover {
        border-color: white;
      }

      .btn-save {
        background: var(--accent);
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
        transition: background 0.2s;
      }

      .btn-save:hover {
        background: var(--accent-dark);
      }

      /* ── CONTENT ── */
      .admin-content {
        max-width: 860px;
        margin: 0 auto;
        padding: 28px 20px 48px;
      }

      /* ── SECTION CARD ── */
      .admin-section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 22px 24px;
        margin-bottom: 20px;
      }

      .admin-section h2 {
        font-size: 13px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--accent);
        border-bottom: 2px solid var(--accent);
        padding-bottom: 8px;
        margin-bottom: 18px;
      }

      /* ── FORM ELEMENTS ── */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .cols-1 {
        grid-template-columns: 1fr;
      }
      .cols-3 {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .col-span-2 {
        grid-column: span 2;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 12px;
        font-weight: bold;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      input[type="text"],
      input[type="tel"],
      input[type="email"],
      input[type="url"],
      textarea {
        width: 100%;
        padding: 8px 11px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 14px;
        font-family: Arial, sans-serif;
        color: var(--text);
        background: white;
        transition: border-color 0.15s;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
      }

      textarea {
        resize: vertical;
        min-height: 90px;
        line-height: 1.5;
      }

      /* ── ENTRY ROWS ── */
      .entry-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        background: #fafafa;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 14px;
        margin-bottom: 10px;
      }

      .entry-fields {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .entry-fields.row {
        flex-direction: row;
        align-items: center;
      }

      .btn-remove {
        background: var(--danger);
        color: white;
        border: none;
        padding: 6px 11px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
        flex-shrink: 0;
        margin-top: 1px;
        transition: background 0.15s;
      }

      .btn-remove:hover {
        background: var(--danger-dark);
      }

      .btn-add {
        width: 100%;
        background: transparent;
        color: var(--accent);
        border: 1px dashed var(--accent);
        padding: 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        margin-top: 4px;
        transition: background 0.15s;
      }

      .btn-add:hover {
        background: #fef8ec;
      }

      /* ── SKILL LEVEL ── */
      .skill-level-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .skill-level-row input[type="range"] {
        flex: 1;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .level-badge {
        font-size: 12px;
        color: var(--muted);
        min-width: 34px;
        text-align: right;
      }

      /* ── EXPERIENCE ENTRY ── */
      .exp-entry {
        background: #fafafa;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 16px;
        margin-bottom: 14px;
      }

      .exp-entry-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .exp-entry-label {
        font-size: 12px;
        font-weight: bold;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .exp-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      .exp-fields .full {
        grid-column: span 2;
      }

      /* ── BULLETS ── */
      .bullets-label {
        font-size: 12px;
        font-weight: bold;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }

      .bullet-row {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
      }

      .bullet-row input {
        flex: 1;
      }

      .btn-rm-bullet {
        background: none;
        border: none;
        color: var(--danger);
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        padding: 0 4px;
        flex-shrink: 0;
      }

      .btn-add-bullet {
        background: none;
        border: none;
        color: var(--accent);
        font-size: 13px;
        cursor: pointer;
        padding: 2px 0;
        text-align: left;
      }

      /* ── PHOTO MANAGER ── */
      .photo-manager {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 14px;
        background: #fafafa;
      }

      .photo-manager-label {
        font-size: 12px;
        font-weight: bold;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }

      .photo-manager-body {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }

      .photo-inputs {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .photo-inputs label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .photo-or {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }

      .photo-preview-wrap {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 3px solid var(--accent);
        background: #e0e0e0;
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .photo-preview-wrap img {
        width: 110px;
        height: 110px;
        object-fit: cover;
        display: none;
      }

      .photo-preview-wrap img.loaded {
        display: block;
      }

      #photo-preview-empty {
        font-size: 11px;
        color: var(--muted);
      }

      /* ── DANGER ZONE ── */
      .danger-zone {
        text-align: right;
        margin-top: 8px;
      }

      .btn-reset {
        background: transparent;
        color: var(--danger);
        border: 1px solid var(--danger);
        padding: 7px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        transition: background 0.15s;
      }

      .btn-reset:hover {
        background: #fdf0ef;
      }

      /* ── TOAST ── */
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--success);
        color: white;
        padding: 11px 20px;
        border-radius: 6px;
        font-size: 14px;
        z-index: 9999;
        transform: translateY(20px);
        opacity: 0;
        transition: all 0.25s ease;
        pointer-events: none;
      }

      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>

    <header class="admin-header">
      <h1>Resume <span>Manager</span></h1>
      <div class="header-actions">
        <a href="index.html" target="_blank" class="btn-preview">Preview Resume</a>
        <button class="btn-save" onclick="saveData()">Save Changes</button>
      </div>
    </header>

    <div class="admin-content">

      <!-- Basic Info -->
      <div class="admin-section">
        <h2>Basic Information</h2>
        <div class="form-grid">
          <label>Full Name<input type="text" id="f-name" placeholder="SOHAM PATIL" /></label>
          <label>Role / Title<input type="text" id="f-role" placeholder="DEVOPS ENGINEER" /></label>
          <label>Phone<input type="tel" id="f-phone" placeholder="+91 9867256690" /></label>
          <label>Email<input type="email" id="f-email" placeholder="email@example.com" /></label>
          <label>LinkedIn URL<input type="url" id="f-linkedin" placeholder="https://linkedin.com/in/..." /></label>
          <label>GitHub URL<input type="url" id="f-github" placeholder="https://github.com/..." /></label>
          <div class="col-span-2 photo-manager">
            <div class="photo-manager-label">Profile Photo</div>
            <div class="photo-manager-body">
              <div class="photo-inputs">
                <label style="text-transform:none;font-weight:normal;font-size:13px;color:var(--muted)">
                  Image URL
                  <input type="text" id="f-photo" placeholder="https://example.com/photo.jpg"
                    oninput="onPhotoUrlChange(this.value)" />
                </label>
                <div class="photo-or">— or —</div>
                <label style="text-transform:none;font-weight:normal;font-size:13px;color:var(--muted)">
                  Upload File
                  <input type="file" id="f-photo-file" accept="image/*" onchange="onPhotoFileChange(event)" style="margin-top:4px" />
                </label>
              </div>
              <div class="photo-preview-wrap">
                <img id="photo-preview" src="" alt="Preview" />
                <span id="photo-preview-empty">No photo</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- About -->
      <div class="admin-section">
        <h2>About Me</h2>
        <textarea id="f-about" rows="5" placeholder="Write a short professional summary..."></textarea>
      </div>

      <!-- Education -->
      <div class="admin-section">
        <h2>Education</h2>
        <div id="education-entries"></div>
        <button class="btn-add" onclick="addEducation()">+ Add Education</button>
      </div>

      <!-- Expertise -->
      <div class="admin-section">
        <h2>Expertise (Soft Skills)</h2>
        <div id="expertise-entries"></div>
        <button class="btn-add" onclick="addExpertise()">+ Add Skill</button>
      </div>

      <!-- Personal -->
      <div class="admin-section">
        <h2>Personal Information</h2>
        <div class="form-grid cols-3">
          <label>Date of Birth<input type="text" id="f-dob" placeholder="08 February 2001" /></label>
          <label>Gender<input type="text" id="f-gender" placeholder="Male" /></label>
          <label>Marital Status<input type="text" id="f-marital" placeholder="Unmarried" /></label>
        </div>
      </div>

      <!-- Languages -->
      <div class="admin-section">
        <h2>Languages</h2>
        <div id="language-entries"></div>
        <button class="btn-add" onclick="addLanguage()">+ Add Language</button>
      </div>

      <!-- Experience -->
      <div class="admin-section">
        <h2>Work Experience</h2>
        <div id="experience-entries"></div>
        <button class="btn-add" onclick="addExperience()">+ Add Experience</button>
      </div>

      <!-- Skills -->
      <div class="admin-section">
        <h2>Software Skills</h2>
        <div id="skills-entries"></div>
        <button class="btn-add" onclick="addSkill()">+ Add Skill</button>
      </div>

      <!-- Danger zone -->
      <div class="danger-zone">
        <button class="btn-reset" onclick="resetToDefault()">Reset to Default Data</button>
      </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
      const DEFAULT_DATA = {
        name: "SOHAM PATIL",
        role: "DEVOPS ENGINEER",
        phone: "+91 9867256690",
        email: "sohamsatyajitpatil@email.com",
        linkedin: "https://www.linkedin.com/in/soham-patil-58b966282/",
        github: "https://github.com/sohampatil8",
        photo: "https://avatars.githubusercontent.com/u/166801115?v=4",
        about: "DevOps Engineer with hands-on experience in AWS, automation and containerization. Skilled in building CI/CD pipelines, managing cloud infrastructure, and improving system reliability. Strong background in Linux, scripting (PowerShell & Bash), and infrastructure automation to reduce costs and enhance performance.",
        education: [
          { years: "2020–2023", degree: "Bachelor of Management Studies (IT)", institution: "University of Mumbai" },
          { years: "2018–2020", degree: "Higher Secondary Education (IT)", institution: "University of Mumbai" },
          { years: "2016–2017", degree: "CBSE", institution: "" }
        ],
        expertise: ["Creativity", "Responsibility", "Communication", "Time Management", "Teamwork", "Motivation", "Organization"],
        personal: { dob: "08 February 2001", gender: "Male", marital: "Unmarried" },
        languages: ["English", "Hindi", "Marathi"],
        experience: [
          {
            period: "Dec 2024 – Present",
            position: "Junior Engineer",
            company: "TechVits Pvt Ltd / Mumbai",
            bullets: [
              "Automated infrastructure and deployment workflows using PowerShell and Linux scripting.",
              "Collected hardware and network interface data from systems and stored in PostgreSQL & MSSQL.",
              "Improved deployment efficiency and reduced manual effort through automation.",
              "Worked on VMware environments for system monitoring and management."
            ]
          },
          {
            period: "Jan 2024 – Dec 2024",
            position: "DevOps Engineer Intern",
            company: "HisanLabs Pvt Ltd / Pune",
            bullets: [
              "Built and maintained CI/CD pipelines using Jenkins.",
              "Containerized applications using Docker for consistent deployments.",
              "Assisted in provisioning cloud infrastructure using AWS services.",
              "Improved system reliability and deployment speed."
            ]
          }
        ],
        skills: [
          { name: "Docker", level: 85 },
          { name: "Kubernetes", level: 80 },
          { name: "Terraform", level: 80 },
          { name: "Jenkins", level: 80 },
          { name: "Ansible", level: 75 },
          { name: "Git", level: 85 },
          { name: "AWS — EC2, S3, RDS, EKS, Route53", level: 75 },
          { name: "Azure — VMs, Blob Storage, Azure DevOps", level: 75 },
          { name: "Linux", level: 85 },
          { name: "Scripting — PowerShell & Bash", level: 80 }
        ]
      };

      /* ── PHOTO MANAGER ── */
      function setPhotoPreview(src) {
        const img = document.getElementById("photo-preview");
        const empty = document.getElementById("photo-preview-empty");
        if (src) {
          img.src = src;
          img.onload = () => { img.classList.add("loaded"); empty.style.display = "none"; };
          img.onerror = () => { img.classList.remove("loaded"); empty.style.display = ""; };
        } else {
          img.src = "";
          img.classList.remove("loaded");
          empty.style.display = "";
        }
      }

      function onPhotoUrlChange(val) {
        setPhotoPreview(val.trim());
      }

      function onPhotoFileChange(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const b64 = e.target.result;
          document.getElementById("f-photo").value = b64;
          setPhotoPreview(b64);
        };
        reader.readAsDataURL(file);
      }

      function esc(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function loadData() {
        try {
          const s = localStorage.getItem("resumeData");
          return s ? JSON.parse(s) : DEFAULT_DATA;
        } catch {
          return DEFAULT_DATA;
        }
      }

      /* ── POPULATE ALL FORMS ── */
      function populateForms(data) {
        document.getElementById("f-name").value = data.name;
        document.getElementById("f-role").value = data.role;
        document.getElementById("f-phone").value = data.phone;
        document.getElementById("f-email").value = data.email;
        document.getElementById("f-linkedin").value = data.linkedin;
        document.getElementById("f-github").value = data.github;
        document.getElementById("f-photo").value = data.photo;
        setPhotoPreview(data.photo);
        document.getElementById("f-about").value = data.about;
        document.getElementById("f-dob").value = data.personal.dob;
        document.getElementById("f-gender").value = data.personal.gender;
        document.getElementById("f-marital").value = data.personal.marital;

        document.getElementById("education-entries").innerHTML = "";
        data.education.forEach((e) => addEducation(e));

        document.getElementById("expertise-entries").innerHTML = "";
        data.expertise.forEach((e) => addExpertise(e));

        document.getElementById("language-entries").innerHTML = "";
        data.languages.forEach((l) => addLanguage(l));

        document.getElementById("experience-entries").innerHTML = "";
        data.experience.forEach((e) => addExperience(e));

        document.getElementById("skills-entries").innerHTML = "";
        data.skills.forEach((s) => addSkill(s));
      }

      /* ── COLLECT ALL FORM DATA ── */
      function collectData() {
        return {
          name: document.getElementById("f-name").value.trim(),
          role: document.getElementById("f-role").value.trim(),
          phone: document.getElementById("f-phone").value.trim(),
          email: document.getElementById("f-email").value.trim(),
          linkedin: document.getElementById("f-linkedin").value.trim(),
          github: document.getElementById("f-github").value.trim(),
          photo: document.getElementById("f-photo").value.trim(),
          about: document.getElementById("f-about").value.trim(),
          personal: {
            dob: document.getElementById("f-dob").value.trim(),
            gender: document.getElementById("f-gender").value.trim(),
            marital: document.getElementById("f-marital").value.trim(),
          },
          education: Array.from(
            document.querySelectorAll("#education-entries .entry-row")
          ).map((row) => ({
            years: row.querySelector("[name=edu-years]").value.trim(),
            degree: row.querySelector("[name=edu-degree]").value.trim(),
            institution: row.querySelector("[name=edu-institution]").value.trim(),
          })),
          expertise: Array.from(document.querySelectorAll("[name=expertise-item]"))
            .map((i) => i.value.trim())
            .filter(Boolean),
          languages: Array.from(document.querySelectorAll("[name=lang-item]"))
            .map((i) => i.value.trim())
            .filter(Boolean),
          experience: Array.from(
            document.querySelectorAll("#experience-entries .exp-entry")
          ).map((entry) => ({
            period: entry.querySelector("[name=exp-period]").value.trim(),
            position: entry.querySelector("[name=exp-position]").value.trim(),
            company: entry.querySelector("[name=exp-company]").value.trim(),
            bullets: Array.from(entry.querySelectorAll("[name=exp-bullet]"))
              .map((i) => i.value.trim())
              .filter(Boolean),
          })),
          skills: Array.from(
            document.querySelectorAll("#skills-entries .entry-row")
          ).map((row) => ({
            name: row.querySelector("[name=skill-name]").value.trim(),
            level: parseInt(row.querySelector("[name=skill-level]").value, 10),
          })),
        };
      }

      /* ── SAVE & RESET ── */
      function saveData() {
        const data = collectData();
        localStorage.setItem("resumeData", JSON.stringify(data));
        showToast("Changes saved!");
      }

      function resetToDefault() {
        if (confirm("Reset all fields to the original default data?")) {
          localStorage.removeItem("resumeData");
          populateForms(DEFAULT_DATA);
          showToast("Reset to default.");
        }
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2500);
      }

      /* ── EDUCATION ── */
      function addEducation(data = { years: "", degree: "", institution: "" }) {
        const row = document.createElement("div");
        row.className = "entry-row";
        row.innerHTML = `
          <div class="entry-fields">
            <input type="text" name="edu-years" placeholder="Years (e.g. 2020–2023)" value="${esc(data.years)}" />
            <input type="text" name="edu-degree" placeholder="Degree / Course" value="${esc(data.degree)}" />
            <input type="text" name="edu-institution" placeholder="Institution (optional)" value="${esc(data.institution)}" />
          </div>
          <button class="btn-remove" onclick="this.closest('.entry-row').remove()">Remove</button>
        `;
        document.getElementById("education-entries").appendChild(row);
      }

      /* ── EXPERTISE ── */
      function addExpertise(text = "") {
        const row = document.createElement("div");
        row.className = "entry-row";
        row.innerHTML = `
          <div class="entry-fields row">
            <input type="text" name="expertise-item" placeholder="e.g. Communication" value="${esc(text)}" />
          </div>
          <button class="btn-remove" onclick="this.closest('.entry-row').remove()">Remove</button>
        `;
        document.getElementById("expertise-entries").appendChild(row);
      }

      /* ── LANGUAGES ── */
      function addLanguage(text = "") {
        const row = document.createElement("div");
        row.className = "entry-row";
        row.innerHTML = `
          <div class="entry-fields row">
            <input type="text" name="lang-item" placeholder="e.g. English" value="${esc(text)}" />
          </div>
          <button class="btn-remove" onclick="this.closest('.entry-row').remove()">Remove</button>
        `;
        document.getElementById("language-entries").appendChild(row);
      }

      /* ── EXPERIENCE ── */
      function addExperience(data = { period: "", position: "", company: "", bullets: [] }) {
        const entry = document.createElement("div");
        entry.className = "exp-entry";
        entry.innerHTML = `
          <div class="exp-entry-header">
            <span class="exp-entry-label">Experience Entry</span>
            <button class="btn-remove" onclick="this.closest('.exp-entry').remove()">Remove Entry</button>
          </div>
          <div class="exp-fields">
            <input type="text" name="exp-period" placeholder="Period (e.g. Jan 2024 – Dec 2024)" value="${esc(data.period)}" />
            <input type="text" name="exp-position" placeholder="Position Title" value="${esc(data.position)}" />
            <input type="text" name="exp-company" placeholder="Company / Location" value="${esc(data.company)}" class="full" />
          </div>
          <div class="bullets-label">Bullet Points</div>
          <div class="exp-bullets">
            ${data.bullets.map(bulletRowHTML).join("")}
          </div>
          <button class="btn-add-bullet" onclick="addBullet(this.previousElementSibling)">+ Add Bullet</button>
        `;
        document.getElementById("experience-entries").appendChild(entry);
      }

      function bulletRowHTML(text = "") {
        return `
          <div class="bullet-row">
            <input type="text" name="exp-bullet" placeholder="Describe what you did..." value="${esc(text)}" />
            <button class="btn-rm-bullet" onclick="this.closest('.bullet-row').remove()" title="Remove">&times;</button>
          </div>
        `;
      }

      function addBullet(bulletsContainer) {
        bulletsContainer.insertAdjacentHTML("beforeend", bulletRowHTML());
        bulletsContainer.lastElementChild.querySelector("input").focus();
      }

      /* ── SKILLS ── */
      function addSkill(data = { name: "", level: 80 }) {
        const row = document.createElement("div");
        row.className = "entry-row";
        row.innerHTML = `
          <div class="entry-fields">
            <input type="text" name="skill-name" placeholder="Skill name (e.g. Docker)" value="${esc(data.name)}" />
            <div class="skill-level-row">
              <input type="range" name="skill-level" min="0" max="100" value="${data.level}"
                oninput="this.nextElementSibling.textContent = this.value + '%'" />
              <span class="level-badge">${data.level}%</span>
            </div>
          </div>
          <button class="btn-remove" onclick="this.closest('.entry-row').remove()">Remove</button>
        `;
        document.getElementById("skills-entries").appendChild(row);
      }

      /* ── INIT ── */
      document.addEventListener("DOMContentLoaded", () => {
        populateForms(loadData());
      });
    </script>
  </body>
</html>
