kind: Deployment
apiVersion: apps/v1
metadata:
  name: picnic-app
  labels:
    app: picnic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: picnic
      page: Home
  template:
    metadata:
      labels:
        app: picnic
        page: Home
    spec:
      containers:
        - name: picnic_home
          image: sohampatil08/blue-green-deployment:dockertest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          ports:
            - containerPort: 80
              protocol: TCP
