<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Printable Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f4f6f9;
      }

      .container {
        max-width: 800px;
        margin: auto;
        background: #fff;
        padding: 30px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      /* Print Button */
      .print-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        border-radius: 5px;
        font-size: 14px;
      }

      .print-btn:hover {
        background-color: #0056b3;
      }

      /* Hide button when printing */
      @media print {
        .print-btn {
          display: none;
        }
        body {
          background: white;
          margin: 0;
        }
        .container {
          box-shadow: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <button class="print-btn" onclick="printPage()">Print / Save PDF</button>

    <div class="container">
      <h1>Printable Page</h1>
      <p>
        This is your printable HTML page. Replace this content with your resume,
        report, or any design you want.
      </p>

      <h2>Example Section</h2>
      <p>
        Add your structured content here. When you click the print button, it
        will open the print dialog where you can select:
        <b>Save as PDF</b>.
      </p>
    </div>

    <script>
      function printPage() {
        window.print();
      }
    </script>
  </body>
</html>
